<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Rail Planner</title>
<meta http-equiv="refresh" content="0; url=https://claude.ai/artifact/GMRSKJkX7bo3s4KBa11bej">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230071e3'/%3E%3Crect x='10' y='29' width='44' height='6' rx='3' fill='%23fff'/%3E%3Ccircle cx='20' cy='32' r='6' fill='%23fff'/%3E%3Ccircle cx='44' cy='32' r='6' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f5f7;--ink:#1d1d1f;--muted:#6e6e73;--blue:#0071e3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#f5f5f7;--muted:#98989d}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);text-align:center;padding:16px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 8px}
p{color:var(--muted);margin:0 0 8px;font-size:15px;line-height:1.5}
a{color:var(--blue);text-decoration:none;font-weight:600}
a:hover{text-decoration:underline}
small{display:block;margin-top:22px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div>
  <h1>Rail Planner</h1>
  <p data-i="go"></p>
  <p><a id="main" href="https://claude.ai/artifact/GMRSKJkX7bo3s4KBa11bej" data-i="btn"></a></p>
  <small><a href="./app/" data-i="alt"></a></small>
</div>
<script>
const T={
 'zh-Hans':{go:'正在打开 Rail Planner（用你的 Claude 账号，免费账号即可）…',btn:'没有自动跳转？点这里 →',alt:'不想登录 Claude？用免登录网页版（助手需自备密钥）'},
 'zh-Hant':{go:'正在打開 Rail Planner（用你的 Claude 帳號，免費帳號即可）…',btn:'沒有自動跳轉？點這裡 →',alt:'不想登入 Claude？用免登入網頁版（助手需自備金鑰）'},
 en:{go:'Opening Rail Planner (with your Claude account — a free one is enough)…',btn:'Not redirected? Click here →',alt:'Prefer no Claude login? Use the no-login version (assistant needs your own key)'},
 de:{go:'Rail Planner wird geöffnet (mit deinem Claude-Konto — ein kostenloses reicht)…',btn:'Keine Weiterleitung? Hier klicken →',alt:'Lieber ohne Claude-Login? Web-Version ohne Login (Assistent braucht eigenen Schlüssel)'}};
const l=(navigator.language||'en').toLowerCase();
const k=l.startsWith('zh')?(/tw|hk|mo|hant/.test(l)?'zh-Hant':'zh-Hans'):l.startsWith('de')?'de':'en';
document.documentElement.lang=k;
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[k][e.dataset.i]);
setTimeout(()=>location.replace(document.getElementById('main').href),150);
</script>
</body>
</html>
