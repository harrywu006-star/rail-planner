<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Rail Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230071e3'/%3E%3Crect x='10' y='29' width='44' height='6' rx='3' fill='%23fff'/%3E%3Ccircle cx='20' cy='32' r='6' fill='%23fff'/%3E%3Ccircle cx='44' cy='32' r='6' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f5f7;--surface:#fff;--ink:#1d1d1f;--muted:#6e6e73;--blue:#0071e3;--blue-h:#0077ed;--hair:#d2d2d7;
  --sh:0 4px 12px -6px rgba(0,0,0,.1),0 12px 32px -14px rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surface:#1c1c1e;--ink:#f5f5f7;--muted:#98989d;--hair:#38383c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  min-height:100vh;display:flex;flex-direction:column}
:root:lang(zh-Hant) body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Hiragino Sans CNS","Microsoft JhengHei","Noto Sans TC",sans-serif}
nav{display:flex;justify-content:flex-end;gap:6px;padding:14px 16px}
nav button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:6px 10px;border-radius:999px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px 64px}
.logo{width:72px;height:72px;border-radius:18px;background:var(--blue);display:grid;place-items:center;margin-bottom:22px;box-shadow:var(--sh)}
h1{font-size:clamp(34px,6vw,56px);letter-spacing:-.02em;margin:0 0 10px;font-weight:700}
.sub{font-size:clamp(17px,2.4vw,21px);color:var(--muted);max-width:560px;margin:0 0 36px;line-height:1.45}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;width:min(720px,100%)}
.card{background:var(--surface);border-radius:20px;padding:26px 24px 22px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:8px}
.card h2{margin:0;font-size:19px;letter-spacing:-.01em}
.card p{margin:0 0 10px;color:var(--muted);font-size:14px;line-height:1.5;flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:15px;font-weight:600;padding:11px 20px;border-radius:999px;transition:.15s}
.btn.pri{background:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue-h)}
.btn.sec{background:transparent;color:var(--blue);padding-left:0}
.btn.sec:hover{text-decoration:underline}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--blue)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:0 16px 28px;line-height:1.6}
footer a{color:inherit}
</style>
</head>
<body>
<nav id="langs"></nav>
<main>
  <div class="logo"><svg width="40" height="40" viewBox="0 0 64 64"><rect x="10" y="29" width="44" height="6" rx="3" fill="#fff"/><circle cx="20" cy="32" r="6" fill="#fff"/><circle cx="44" cy="32" r="6" fill="#fff"/></svg></div>
  <h1>Rail Planner</h1>
  <p class="sub" data-i="sub"></p>
  <div class="cards">
    <div class="card">
      <span class="tag" data-i="tag1"></span>
      <h2 data-i="h1"></h2>
      <p data-i="p1"></p>
      <a class="btn pri" href="https://claude.ai/artifact/GMRSKJkX7bo3s4KBa11bej" data-i="b1"></a>
    </div>
    <div class="card">
      <span class="tag" data-i="tag2"></span>
      <h2 data-i="h2"></h2>
      <p data-i="p2"></p>
      <a class="btn sec" href="./app/" data-i="b2"></a>
    </div>
  </div>
</main>
<footer data-i="foot"></footer>
<script>
const T={
 'zh-Hans':{name:'简体中文',sub:'一天是一条轨道。桩钉死，弹性段可涨 —— 把每周的时间排成一张看得见的表。',
  tag1:'推荐',h1:'打开 Rail Planner',p1:'用你的 Claude 账号打开（免费账号即可）。里面的「✦ 助手」直接用你的账号帮你排一日轨道、一周分配和运行规则，不需要任何密钥。',b1:'用 Claude 账号打开 →',
  tag2:'备选',h2:'免登录网页版',p2:'不用登录、任何浏览器直接用，功能和上面一样；但这个版本里的助手需要自备 Anthropic API 密钥。',b2:'直接打开 →',
  foot:'数据只存在你自己的浏览器里，可在页面内备份 / 恢复。'},
 'zh-Hant':{name:'繁體中文',sub:'一天是一條軌道。樁釘死，彈性段可漲 —— 把每週的時間排成一張看得見的表。',
  tag1:'推薦',h1:'打開 Rail Planner',p1:'用你的 Claude 帳號打開（免費帳號即可）。裡面的「✦ 助手」直接用你的帳號幫你排一日軌道、一週分配和運行規則，不需要任何金鑰。',b1:'用 Claude 帳號打開 →',
  tag2:'備選',h2:'免登入網頁版',p2:'不用登入、任何瀏覽器直接用，功能和上面一樣；但這個版本裡的助手需要自備 Anthropic API 金鑰。',b2:'直接打開 →',
  foot:'資料只存在你自己的瀏覽器裡，可在頁面內備份 / 還原。'},
 en:{name:'English',sub:'A day is a rail. Posts are fixed, elastic blocks may stretch — lay your week out as one visible table.',
  tag1:'Recommended',h1:'Open Rail Planner',p1:'Opens with your Claude account (a free account is enough). The built-in ✦ Assistant plans your day rail, weekly split and rules using your own account — no keys needed.',b1:'Open with Claude →',
  tag2:'Alternative',h2:'No-login web version',p2:'Works in any browser without signing in, same features; the assistant in this version needs your own Anthropic API key.',b2:'Open directly →',
  foot:'Your data lives only in your own browser; back up / restore from inside the page.'},
 de:{name:'Deutsch',sub:'Ein Tag ist eine Schiene. Pfosten stehen fest, elastische Blöcke dürfen wachsen — leg deine Woche als eine sichtbare Tabelle an.',
  tag1:'Empfohlen',h1:'Rail Planner öffnen',p1:'Öffnet sich mit deinem Claude-Konto (ein kostenloses reicht). Der eingebaute ✦ Assistent plant Tagesschiene, Wochenverteilung und Regeln über dein eigenes Konto — ohne Schlüssel.',b1:'Mit Claude öffnen →',
  tag2:'Alternative',h2:'Web-Version ohne Login',p2:'Läuft in jedem Browser ohne Anmeldung, gleiche Funktionen; der Assistent braucht in dieser Version einen eigenen Anthropic-API-Schlüssel.',b2:'Direkt öffnen →',
  foot:'Deine Daten liegen nur in deinem eigenen Browser; Sicherung / Wiederherstellung in der Seite.'}
};
const KEY='rail-planner-lang';
function detect(){try{const s=localStorage.getItem(KEY);if(T[s])return s}catch(e){}
  const l=(navigator.language||'en').toLowerCase();
  if(l.startsWith('zh'))return /tw|hk|mo|hant/.test(l)?'zh-Hant':'zh-Hans';
  if(l.startsWith('de'))return 'de';return 'en'}
function apply(k){const t=T[k];document.documentElement.lang=k;
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t[el.dataset.i]);
  document.querySelectorAll('#langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
  try{localStorage.setItem(KEY,k)}catch(e){}}
document.getElementById('langs').innerHTML=Object.keys(T).map(k=>`<button data-k="${k}">${T[k].name}</button>`).join('');
document.getElementById('langs').onclick=e=>{const b=e.target.closest('button');if(b)apply(b.dataset.k)};
apply(detect());
</script>
</body>
</html>
