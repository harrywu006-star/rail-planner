<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Rail Planner — 把一天排成一条轨道。四种语言，无需注册，所有改动只存在你自己的浏览器里。">
<title>Rail Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230071e3'/%3E%3Crect x='10' y='22' width='44' height='8' rx='4' fill='white'/%3E%3Crect x='10' y='36' width='28' height='8' rx='4' fill='white' opacity='.75'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface2:#fafafa; --sunken:#f0f0f2;
  --ink:#1d1d1f; --ink2:#424245; --muted:#6e6e73; --faint:#86868b;
  --hair:#d2d2d7; --hair2:#e8e8ed;
  --blue:#0071e3; --blue-h:#0077ed;
  --nav:rgba(255,255,255,.72);
  --mix-bg:#ffffff; --tint-amt:13%;
  --mix-ed:#ffffff; --edge-amt:100%;
  --mix-fg:#1d1d1f; --fg-amt:90%;
  --sh-s:0 1px 2px rgba(0,0,0,.04), 0 4px 12px -6px rgba(0,0,0,.10);
  --sh-m:0 1px 3px rgba(0,0,0,.05), 0 12px 32px -14px rgba(0,0,0,.18);
  --r-l:18px; --r-m:12px;
  --cjk:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC";
}
:root:lang(zh-Hant){--cjk:"PingFang TC","Hiragino Sans CNS","Microsoft JhengHei","Noto Sans TC"}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1c1c1e; --surface2:#161618; --sunken:#0c0c0d;
    --ink:#f5f5f7; --ink2:#d6d6da; --muted:#98989d; --faint:#7d7d82;
    --hair:#38383c; --hair2:#2a2a2d;
    --blue:#2997ff; --blue-h:#48a5ff;
    --nav:rgba(22,22,24,.72);
    --mix-bg:#000000; --tint-amt:26%;
    --mix-ed:#ffffff; --edge-amt:80%;
    --mix-fg:#ffffff; --fg-amt:62%;
    --sh-s:0 1px 2px rgba(0,0,0,.5); --sh-m:0 12px 32px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface2:#161618; --sunken:#0c0c0d;
  --ink:#f5f5f7; --ink2:#d6d6da; --muted:#98989d; --faint:#7d7d82;
  --hair:#38383c; --hair2:#2a2a2d;
  --blue:#2997ff; --blue-h:#48a5ff;
  --nav:rgba(22,22,24,.72);
  --mix-bg:#000000; --tint-amt:26%;
  --mix-ed:#ffffff; --edge-amt:80%;
  --mix-fg:#ffffff; --fg-amt:62%;
  --sh-s:0 1px 2px rgba(0,0,0,.5); --sh-m:0 12px 32px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",var(--cjk),sans-serif;
  font-size:15px; line-height:1.5; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
.num{font-variant-numeric:tabular-nums}

/* nav */
.nav{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:60;
  background:var(--nav); backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--hair2);
}
.nav-in{
  max-width:1680px; margin:0 auto; padding:7px 22px; min-height:52px;
  display:flex; align-items:center; gap:10px 12px; flex-wrap:wrap;
}
.brand{font-size:15px; font-weight:600; letter-spacing:-.02em; margin-right:auto; display:flex; align-items:center; gap:9px; white-space:nowrap}
.brand .dot{width:8px; height:8px; border-radius:50%; background:var(--blue); flex:none}
.seg{display:flex; background:var(--sunken); border-radius:980px; padding:2px; gap:2px}
.seg button{
  border:0; background:transparent; color:var(--muted); cursor:pointer;
  font:inherit; font-size:13px; font-weight:500; padding:5px 15px; border-radius:980px;
  transition:background .18s,color .18s; white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--sh-s)}
.btn{
  border:0; cursor:pointer; font:inherit; font-size:13px; font-weight:500;
  padding:6px 15px; border-radius:980px; background:var(--sunken); color:var(--ink);
  transition:background .18s,transform .1s; white-space:nowrap;
}
.btn:hover{background:var(--hair2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--blue); color:#fff}
.btn.pri:hover{background:var(--blue-h)}
.btn.warn{background:#ff3b30; color:#fff}
.btn.ghost{background:transparent; color:var(--blue)}
.btn.ghost:hover{background:var(--sunken)}
select.lang{
  font:inherit; font-size:13px; font-weight:500; color:var(--ink);
  background:var(--sunken); border:0; border-radius:980px; padding:6px 11px;
  cursor:pointer; appearance:none; -webkit-appearance:none;
}
select.lang:hover{background:var(--hair2)}
.status{font-size:12px; color:var(--faint); min-width:82px; text-align:right; letter-spacing:0}

/* shell */
.page{max-width:1680px; margin:0 auto; padding-inline:22px; padding-block:0 96px}
.hero{padding:74px 0 46px; text-align:center}
.hero h1{margin:0; font-size:clamp(34px,5.2vw,70px); font-weight:600; letter-spacing:-.028em; line-height:1.05; text-wrap:balance}
.hero .lede{margin:17px auto 0; max-width:660px; font-size:clamp(16px,1.5vw,20px); color:var(--muted); line-height:1.45; letter-spacing:-.012em}
.stats{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:38px}
.stat{background:var(--surface); border-radius:var(--r-m); padding:14px 22px; box-shadow:var(--sh-s); min-width:118px; position:relative; text-align:left}
.stat .sv{font-size:26px; font-weight:600; letter-spacing:-.022em; line-height:1.15}
.stat .sl{font-size:12px; color:var(--muted); margin-top:3px; letter-spacing:0}

section{margin-top:64px}
.sec-head{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:20px}
.sec-head h2{margin:0; font-size:clamp(24px,2.6vw,34px); font-weight:600; letter-spacing:-.024em; line-height:1.1}
.sec-head p{margin:0; color:var(--muted); font-size:14px; max-width:58ch; flex:1 1 280px; min-height:1.4em}

.tint{
  background:color-mix(in srgb, var(--c) var(--tint-amt), var(--mix-bg));
  --fg:color-mix(in srgb, var(--c) var(--fg-amt), var(--mix-fg));
  --edge:color-mix(in srgb, var(--c) var(--edge-amt), var(--mix-ed));
}

.board{background:var(--surface); border-radius:var(--r-l); padding:20px; box-shadow:var(--sh-m)}
.hscroll{overflow-x:auto; overflow-y:visible; margin:0 -4px; padding:4px}
.track{display:grid; gap:8px; align-items:stretch}
.blk{
  position:relative; border-radius:var(--r-m); padding:12px 11px 13px;
  display:flex; flex-direction:column; gap:3px; min-height:132px;
  border-top:3px solid var(--edge,var(--hair)); transition:box-shadow .18s;
}
.blk:hover{box-shadow:var(--sh-s)}
.blk .bt{font-size:12px; font-weight:600; color:var(--fg); opacity:.85; letter-spacing:0}
.blk .bn{font-size:15px; font-weight:600; letter-spacing:-.015em; line-height:1.22; margin-top:auto; color:var(--ink)}
.blk .bnote{font-size:11.5px; color:var(--muted); line-height:1.3; letter-spacing:0}
.blk .bd{font-size:12px; color:var(--fg); font-weight:500; letter-spacing:0}
.blk .bd .u{opacity:.6}

.wgrid{display:grid; gap:6px; min-width:1000px}
.wcell{padding:10px 11px; border-radius:10px; font-size:13px; line-height:1.34; background:var(--surface2)}
.whead{background:var(--ink); color:var(--bg); font-weight:600; font-size:14px; letter-spacing:-.01em; text-align:center; padding:11px 8px}
.wrowhead{font-weight:600; font-size:13.5px; letter-spacing:-.01em; color:var(--ink); word-break:keep-all; overflow-wrap:normal}
.wrowhead .sub{display:block; font-weight:400; font-size:11px; color:var(--muted); margin-top:2px; letter-spacing:0; word-break:keep-all; overflow-wrap:normal}
.wrow{display:grid; gap:6px; grid-template-columns:var(--wcols)}
.wcorner{background:transparent}

.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(272px,1fr)); gap:18px}
.card{border-radius:var(--r-l); padding:22px 22px 24px; box-shadow:var(--sh-s); border-top:3px solid var(--edge,var(--hair)); position:relative}
.card .eyebrow{font-size:11.5px; font-weight:600; color:var(--fg); letter-spacing:.04em; margin-bottom:7px}
.card h3{margin:0 0 12px; font-size:19px; font-weight:600; letter-spacing:-.018em; line-height:1.24}
.card ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px}
.card li{font-size:13.5px; line-height:1.48; color:var(--ink2); position:relative; padding-left:15px; letter-spacing:-.005em}
.card li::before{content:""; position:absolute; left:2px; top:.62em; width:5px; height:5px; border-radius:50%; background:var(--fg); opacity:.75}

.notes{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px}
.note{border-radius:var(--r-l); padding:20px 22px 22px; box-shadow:var(--sh-s); border-top:3px solid var(--edge,var(--hair)); position:relative}
.note .nlabel{font-size:13px; font-weight:600; color:var(--fg); letter-spacing:.01em; margin-bottom:8px}
.note .nbody{font-size:14px; line-height:1.62; color:var(--ink2); letter-spacing:-.005em; white-space:pre-wrap; min-height:3.2em}

.strip{display:grid; gap:6px; min-width:1000px}

/* weekly timeline: vertical 24 h axis × 7 day columns */
.tl{display:grid; grid-template-columns:52px repeat(7,minmax(128px,1fr)); gap:6px; min-width:1000px; --hpx:30px}
.tl .tlh{background:var(--ink); color:var(--bg); font-weight:600; font-size:14px; letter-spacing:-.01em; text-align:center; padding:9px 6px; border-radius:10px; position:relative; min-height:38px}
.tl .tlh .ic{position:absolute; right:6px; top:9px; display:none}
body.edit .tl .tlh .ic{display:grid}
.tl .tlcorner{background:transparent}
.tl .tlbody{position:relative; height:calc(var(--hpx) * 24); border-radius:10px; background:var(--surface2);
  background-image:repeating-linear-gradient(to bottom, var(--hair2) 0, var(--hair2) 1px, transparent 1px, transparent var(--hpx)); background-position:0 -1px}
.tl .tlaxis{position:relative; height:calc(var(--hpx) * 24)}
.tl .tlaxis span{position:absolute; right:6px; transform:translateY(-55%); font-size:11px; color:var(--faint); letter-spacing:0; font-variant-numeric:tabular-nums}
.tl .ev{position:absolute; left:4px; right:4px; border-radius:8px; padding:4px 7px 5px; overflow:hidden; border-left:3px solid var(--edge,var(--hair));
  display:flex; flex-direction:column; gap:1px; min-height:18px; box-sizing:border-box}
.tl .ev .et{font-size:10.5px; font-weight:600; color:var(--fg); opacity:.9; letter-spacing:0; line-height:1.2; white-space:nowrap}
.tl .ev .en{font-size:12px; font-weight:600; color:var(--ink); line-height:1.2; letter-spacing:-.01em}
.tl .ev.short{flex-direction:row; align-items:center; gap:6px; padding-top:2px; padding-bottom:2px}
.tl .ev.short .en{font-size:11px}
.tl .ev .tools{top:3px; right:4px}
body.edit .tl .ev:hover{z-index:3; box-shadow:var(--sh-m); overflow:visible}
body.edit .tl .ev .tools{display:none}
body.edit .tl .ev:hover .tools{display:flex}
.tl .ev .ic{width:17px; height:17px; font-size:10px}
.tl .ev .sw{width:17px; height:17px}
.tl .tlh .tld{display:block; font-size:11px; font-weight:400; opacity:.7; margin-top:1px; letter-spacing:0; font-variant-numeric:tabular-nums}
.tl .tlh.today{background:var(--blue); color:#fff}
.tl .tlnow{position:absolute; left:0; right:0; height:0; border-top:2px solid #ff3b30; z-index:2; pointer-events:none}
.tl .tlnow::before{content:""; position:absolute; left:-4px; top:-5px; width:8px; height:8px; border-radius:50%; background:#ff3b30}
.tl .ev.linked .et::after{content:" ⇅"; opacity:.55}
.tlfill{display:none; align-items:center; gap:6px; flex-wrap:wrap; margin-top:12px; font-size:12.5px; color:var(--muted)}
body.edit .tlfill{display:flex}
.tlfill .chip{font-size:12px; padding:4px 9px}
.scell{background:var(--surface2); border-radius:10px; padding:13px 13px 15px; display:flex; flex-direction:column; gap:9px; min-height:104px; position:relative}
.scell .slb{font-size:11.5px; font-weight:600; color:var(--muted); letter-spacing:0}
.scell .sline{margin-top:auto; border-bottom:1px dashed var(--hair); height:17px}
.scell .sbox{margin-top:auto; font-size:12.5px; color:var(--ink2); line-height:1.5}
.scell.hi{background:color-mix(in srgb, var(--blue) 12%, var(--surface))}
.scell.hi .slb{color:var(--blue)}

/* editing */
[contenteditable]{outline:none; border-radius:5px; transition:box-shadow .15s,background .15s}
body.edit [contenteditable]{cursor:text}
body.edit [contenteditable]:hover{box-shadow:inset 0 0 0 1px var(--hair)}
[contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--blue)!important; background:color-mix(in srgb,var(--blue) 7%,transparent)}
body.edit [contenteditable]:empty::before{content:attr(data-ph); color:var(--faint); opacity:.75}

.tools{position:absolute; top:7px; right:7px; display:none; gap:3px; z-index:5}
body.edit .blk .tools, body.edit .card .tools, body.edit .scell .tools,
body.edit .wrowhead .tools, body.edit .note .tools, body.edit .stat .tools{display:flex}
body.edit .blk{padding-top:36px}
body.edit .scell{padding-top:34px}
body.edit .card{padding-top:34px}
body.edit .note{padding-top:34px}
body.edit .wrowhead{padding-top:32px}
body.edit .stat{padding-top:34px; min-width:132px}
body.edit .card li{padding-right:22px}
.ic{
  width:19px; height:19px; border-radius:50%; border:0; cursor:pointer; padding:0;
  display:grid; place-items:center; background:var(--surface); color:var(--muted);
  box-shadow:var(--sh-s); font-size:11px; line-height:1; font-family:inherit;
}
.ic:hover{color:var(--ink)}
.ic.del:hover{background:#ff3b30; color:#fff}
.ic.add{font-size:13px; font-weight:600}
.ic.add:hover{background:var(--blue); color:#fff}
.ic.grip{cursor:grab}
.sw{position:relative; width:19px; height:19px}
.sw .swb{position:absolute; inset:0; border:0; padding:0; cursor:pointer; border-radius:50%; background:var(--c); box-shadow:var(--sh-s),inset 0 0 0 1px rgba(0,0,0,.14)}
.sw .swb:hover{transform:scale(1.12)}
.sw input{position:absolute; left:50%; top:100%; width:1px; height:1px; opacity:0; border:0; padding:0; pointer-events:none}

.adder{
  border:1px dashed var(--hair); background:transparent; color:var(--muted);
  border-radius:var(--r-m); cursor:pointer; font:inherit; font-size:13px;
  display:none; place-items:center; min-height:132px; min-width:76px;
}
.adder:hover{border-color:var(--blue); color:var(--blue)}
body.edit .adder{display:grid}
.addrow{
  display:none; margin-top:10px; border:1px dashed var(--hair); background:transparent;
  color:var(--muted); border-radius:10px; cursor:pointer; font:inherit; font-size:13px; padding:10px; width:100%;
}
.addrow:hover{border-color:var(--blue); color:var(--blue)}
body.edit .addrow{display:block}
.boardbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:12px}
.addend{display:none}
body.edit .addend{display:inline-block}
.hint{margin:0; font-size:12.5px; color:var(--faint); display:none; letter-spacing:0}
body.edit .hint{display:block}
.drop-mark{outline:2px solid var(--blue); outline-offset:2px; border-radius:var(--r-m)}
.dragging{opacity:.35}
.caption{font-size:13px; color:var(--muted); margin-top:14px; line-height:1.5; max-width:96ch}

/* palette popover */
.pal{position:fixed; z-index:95; background:var(--surface); border-radius:16px; box-shadow:var(--sh-m),0 0 0 1px var(--hair2); padding:12px; width:238px}
.pal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:7px}
.pal-grid button{width:24px; height:24px; border-radius:50%; border:0; padding:0; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.14); position:relative}
.pal-grid button:hover{transform:scale(1.14)}
.pal-grid button[aria-current="true"]::after{content:"✓"; position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-size:13px; font-weight:700; text-shadow:0 0 3px rgba(0,0,0,.5)}
.pal-foot{display:flex; align-items:center; gap:8px; margin-top:11px; padding-top:10px; border-top:1px solid var(--hair2)}
.pal-foot button{border:0; background:transparent; color:var(--blue); cursor:pointer; font:inherit; font-size:13px; font-weight:500; padding:3px 6px; border-radius:7px}
.pal-foot button:hover{background:var(--sunken)}
.pal-foot .now{margin-left:auto; font-size:11.5px; color:var(--faint); letter-spacing:0}

.ic.back{
  width:30px; height:30px; font-size:22px; font-weight:500; color:var(--blue); background:var(--sunken);
  box-shadow:none; padding-bottom:3px;
}
.ic.back:hover{background:var(--hair2); color:var(--blue)}

/* plan switcher */
.btn.plan{display:inline-flex; align-items:center; gap:6px; max-width:240px}
.btn.plan #planName{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.btn.plan .chev{color:var(--muted); font-size:12px; line-height:1; transform:translateY(-2px)}
.pop{position:fixed; z-index:95; background:var(--surface); border-radius:16px; box-shadow:var(--sh-m),0 0 0 1px var(--hair2); padding:10px; width:min(340px,calc(100vw - 20px))}
.pop-title{font-size:11.5px; font-weight:600; color:var(--muted); letter-spacing:.04em; padding:4px 10px 8px}
.pop-list{display:flex; flex-direction:column; gap:2px; max-height:46vh; overflow:auto}
.pop-list button{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; cursor:pointer;
  background:transparent; color:var(--ink); font:inherit; font-size:13.5px; padding:9px 10px; border-radius:10px;
}
.pop-list button:hover{background:var(--sunken)}
.pop-list button[aria-current="true"]{background:color-mix(in srgb,var(--blue) 10%,transparent)}
.pop-list .pn{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500}
.pop-list .pd{font-size:11.5px; color:var(--faint); letter-spacing:0; white-space:nowrap}
.pop-list .pk{width:16px; color:var(--blue); font-weight:700; text-align:center}
.pop-foot{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; padding-top:10px; border-top:1px solid var(--hair2)}
.pop-foot .btn{padding:6px 12px}
.btn.danger{color:#ff3b30}
.btn.danger:hover{background:rgba(255,59,48,.1)}
input.txt{
  width:100%; border:1px solid var(--hair); border-radius:12px; padding:11px 13px; font:inherit; font-size:15px;
  background:var(--surface2); color:var(--ink); margin-bottom:16px; outline:none;
}
input.txt:focus{border-color:var(--blue); box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
.stback{position:absolute; left:22px; top:22px}
.start-in{position:relative}
@media (max-width:640px){ .stback{position:static; margin-bottom:14px} }

/* sheets */
.sheet{position:fixed; inset:0; z-index:120; display:none; place-items:center; background:rgba(0,0,0,.36); backdrop-filter:blur(4px); padding:20px}
.sheet.on{display:grid}
.sheet-in{background:var(--surface); border-radius:20px; box-shadow:var(--sh-m); padding:26px 26px 22px; max-width:460px; width:100%}
.sheet-in h3{margin:0 0 8px; font-size:20px; font-weight:600; letter-spacing:-.02em}
.sheet-in p{margin:0 0 18px; color:var(--muted); font-size:14px; line-height:1.5}
.sheet-row{display:flex; gap:9px; justify-content:flex-end; flex-wrap:wrap}
textarea.bk{
  width:100%; height:150px; border:1px solid var(--hair); border-radius:12px; padding:11px;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--surface2);
  color:var(--ink); resize:vertical; margin-bottom:14px;
}

/* assistant drawer */
.scrim{position:fixed; inset:0; z-index:108; background:rgba(0,0,0,.28); backdrop-filter:blur(2px); display:none}
.scrim.on{display:block}
.drawer{
  position:fixed; top:0; right:0; bottom:0; z-index:110; width:min(460px,100vw);
  background:var(--surface); box-shadow:-12px 0 40px -20px rgba(0,0,0,.35);
  transform:translateX(102%); transition:transform .28s cubic-bezier(.2,.8,.2,1);
  overflow:auto; padding:20px 22px calc(28px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; gap:18px;
}
.drawer.on{transform:none}
.dr-head{display:flex; align-items:center; gap:10px}
.dr-head h3{margin:0; font-size:20px; font-weight:600; letter-spacing:-.02em; flex:1}
.dr-note{font-size:12.5px; color:var(--muted); line-height:1.5; margin:0}
.dr-box{background:var(--surface2); border:1px solid var(--hair2); border-radius:14px; padding:14px 15px; display:flex; flex-direction:column; gap:10px}
.dr-box .lb{font-size:11.5px; font-weight:600; color:var(--muted); letter-spacing:.04em}
.dr-box textarea{
  width:100%; min-height:118px; border:1px solid var(--hair); border-radius:12px; padding:11px 12px; font:inherit; font-size:14px;
  line-height:1.5; background:var(--surface); color:var(--ink); resize:vertical; outline:none;
}
.dr-box textarea:focus, .dr-box input.txt:focus{border-color:var(--blue); box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
.dr-box input.txt{margin:0}
.dr-box select{font:inherit; font-size:13px; padding:8px 10px; border-radius:10px; border:1px solid var(--hair); background:var(--surface); color:var(--ink); max-width:100%}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; padding:5px 10px; border-radius:980px; background:var(--surface); border:1px solid var(--hair); cursor:pointer; user-select:none}
.chip input{margin:0; accent-color:var(--blue)}
.chip.on{border-color:var(--blue); color:var(--blue); background:color-mix(in srgb,var(--blue) 8%,var(--surface))}
.radios{display:flex; gap:12px; flex-wrap:wrap; font-size:13px}
.radios label{display:inline-flex; align-items:center; gap:6px; cursor:pointer}
.radios input{accent-color:var(--blue); margin:0}
.dr-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.conn{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500}
.conn .dot{width:8px; height:8px; border-radius:50%; background:#ff9f0a; flex:none}
.conn.ok .dot{background:#30d158}
.conn .sub{font-weight:400; color:var(--muted); font-size:12px}
.dr-out{
  border-radius:12px; background:var(--sunken); padding:11px 12px; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--muted); max-height:150px; overflow:auto; white-space:pre-wrap; word-break:break-all; display:none;
}
.dr-out.on{display:block}
.dr-status{font-size:13px; color:var(--ink2); display:flex; align-items:center; gap:8px; min-height:20px}
.spin{width:14px; height:14px; border:2px solid var(--hair); border-top-color:var(--blue); border-radius:50%; animation:sp .8s linear infinite; flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.dr-sum{display:flex; flex-wrap:wrap; gap:6px}
.dr-sum span{font-size:12.5px; padding:4px 10px; border-radius:980px; background:color-mix(in srgb,var(--blue) 10%,var(--surface)); color:var(--blue); font-weight:500}
.dr-err{color:#ff3b30; font-size:13px; line-height:1.45}
.dr-foot{margin-top:auto; font-size:12px; color:var(--faint); line-height:1.5}
a.lnk{color:var(--blue); text-decoration:none; font-size:12.5px}

.pick.ai{background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 10%,var(--surface)),var(--surface))}
.pick.ai b::before{content:"✦ "; color:var(--blue)}

/* first-run chooser */
.start{position:fixed; inset:0; z-index:100; background:var(--bg); overflow:auto; display:none}
.start.on{display:block}
.start-in{max-width:1180px; margin:0 auto; padding:clamp(40px,9vh,96px) 22px 60px; text-align:center}
.start-in .badge{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--muted)}
.start-in .badge .dot{width:8px; height:8px; border-radius:50%; background:var(--blue)}
.start-in h1{margin:16px 0 0; font-size:clamp(30px,4.6vw,56px); font-weight:600; letter-spacing:-.028em; line-height:1.07; text-wrap:balance}
.start-in .sub{margin:15px auto 0; max-width:620px; color:var(--muted); font-size:clamp(15px,1.4vw,18px); line-height:1.5}
.picks{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; margin-top:44px; text-align:left}
.pick{
  background:var(--surface); border:0; border-radius:var(--r-l); padding:24px 22px 22px;
  box-shadow:var(--sh-s); cursor:pointer; font:inherit; color:var(--ink); text-align:left;
  display:flex; flex-direction:column; gap:9px; transition:box-shadow .2s,transform .2s;
}
.pick:hover{box-shadow:var(--sh-m); transform:translateY(-2px)}
.pick .pi{width:30px; height:3px; border-radius:2px; background:var(--pc,var(--hair)); margin-bottom:5px}
.pick b{font-size:17px; font-weight:600; letter-spacing:-.018em}
.pick span{font-size:13.5px; color:var(--muted); line-height:1.5}
.pick .go{margin-top:auto; padding-top:10px; font-size:13px; font-weight:500; color:var(--blue)}
.start-foot{margin-top:34px; display:flex; justify-content:center; align-items:center; gap:12px; flex-wrap:wrap; color:var(--faint); font-size:12.5px}

@media (max-width:640px){
  .hero{padding:44px 0 32px}
  .page{padding-inline:16px}
  .nav-in{padding:7px 16px}
  .board{padding:14px; border-radius:14px}

  .blk{flex:var(--dur,60) 1 0; min-width:0; min-height:96px}
}

 cards:[
  ['01 · 三层复习','重读不算复习：合上书，自己想、自己写、自己做',0,[
   '每天 · 复习块 30′ 是学习的第一件事：Anki 到期卡 15′ + 1 道到期的 ✗ 题 15′（遮住答案自己做）。',
   '每天 · 当天的课 24 小时内做 Nacharbeit：合上讲义写 3–5 个要点 → 对照补红 → 新的 Definition / Formel 做成 Anki 卡。',
   '每周日 · 每门课 20′ 白纸回忆：10′ 写出这周所有内容（定义、公式 + Voraussetzungen、解法），10′ 对照标红；红的变卡或 ✗ 题。然后重做本周所有 ✗。',
   '每 4 周 · 60–90′ 闭卷计时混合小测，从所有 Übungsblatt 打乱抽题：08.11 · 06.12 · 圣诞大复习 · 31.01。',
   '✗ 题间隔：第 1 → 3 → 7 → 21 天。哪次没做出来就从第 1 天重来；连续两次独立做对就划掉。做成 Anki 卡最省事。',
   'Anki 只放要「记住」的：定义、公式 + Voraussetzungen、「看到 X → 做 Y」、Soll / Haben、Anspruchsgrundlagen 与 Prüfungsschema。每天新卡 ≤ 15–20 张，开 FSRS。']],
  ['02 · 课的分量','自学约 19 h + 上课 18–22 h ≈ 38–40 h / 周',2,[
   'Mathe I（8 CP）6 h 和 ETiT I（7 CP）5 h 拿最多 —— 最难、学分最多、互相依赖，数学落下 ETiT 跟着卡。',
   'Buchführung und Bilanzierung（5 CP）2 h：每周固定刷一组 Buchungssätze。',
   'Vertragsrecht（5 CP）2 h：练 Fälle 和 Gutachtenstil，Anki 记 Anspruchsgrundlagen。',
   'Praktikum ETiT IA（2 CP）：按实验安排，约 1 h。每日复习块所有课共用，约 3 h / 周。',
   '每周的 Übungsblatt 是底线：每门课都先自己做，做不出来也要写下卡在哪一步。',
   '用到旧知识时有意识地想一下「这是哪条规则、为什么能这样用」—— 这本身就是一次复习。']],
  ['03 · 爱好轮换','同一时间只有一个爱好在进攻',11,[
   '🔥 进攻 = 当主角，拿大块时间，要看得见进步。🔧 维持 = 最低剂量保住手感。⏸ 暂停 = 不碰，但清楚什么时候回来。',
   '维持剂量：R6 每周约 5 h · 视频每两周一支 · 建模每周 1 次 1.5–2 h · 乐理每周 3 次 15–20′。',
   '进攻剂量：R6 集中冲分赛季 · 视频每周一支 · 建模做一个完整项目 · 乐理系统跟一门课。',
   '建模一次只跟一个教程或项目。乐理的音程、和弦、音阶直接做成 Anki 卡，和学习共用一个复习习惯。',
   '冲 Champion 放到考完试的假期集中打。学期里每周 5 h 大概率只能保段位，零散打很难上分。']],
  ['04 · R6 规则与调整触发','按局数算，不按时间',9,[
   '工作日一次最多 2 局，周末一次最多 4 局。连输 2 局就下线。23:00 以后不开新局。',

 cards:[
  ['01 · 三層複習','重讀不算複習：闔上書，自己想、自己寫、自己做',0,[
   '每天 · 複習塊 30′ 是學習的第一件事：Anki 到期卡 15′ + 1 道到期的 ✗ 題 15′（遮住答案自己做）。',
   '每天 · 當天的課 24 小時內做 Nacharbeit：闔上講義寫 3–5 個要點 → 對照補紅 → 新的 Definition / Formel 做成 Anki 卡。',
   '每週日 · 每門課 20′ 白紙回憶：10′ 寫出這週所有內容（定義、公式 + Voraussetzungen、解法），10′ 對照標紅；紅的變卡或 ✗ 題。然後重做本週所有 ✗。',
   '每 4 週 · 60–90′ 閉卷計時混合小測，從所有 Übungsblatt 打亂抽題：08.11 · 06.12 · 聖誕大複習 · 31.01。',
   '✗ 題間隔：第 1 → 3 → 7 → 21 天。哪次沒做出來就從第 1 天重來；連續兩次獨立做對就劃掉。做成 Anki 卡最省事。',
   'Anki 只放要「記住」的：定義、公式 + Voraussetzungen、「看到 X → 做 Y」、Soll / Haben、Anspruchsgrundlagen 與 Prüfungsschema。每天新卡 ≤ 15–20 張，開 FSRS。']],
  ['02 · 課的分量','自學約 19 h + 上課 18–22 h ≈ 38–40 h / 週',2,[
   'Mathe I（8 CP）6 h 和 ETiT I（7 CP）5 h 拿最多 —— 最難、學分最多、互相依賴，數學落下 ETiT 跟著卡。',
   'Buchführung und Bilanzierung（5 CP）2 h：每週固定刷一組 Buchungssätze。',
   'Vertragsrecht（5 CP）2 h：練 Fälle 和 Gutachtenstil，Anki 記 Anspruchsgrundlagen。',
   'Praktikum ETiT IA（2 CP）：按實驗安排，約 1 h。每日複習塊所有課共用，約 3 h / 週。',
   '每週的 Übungsblatt 是底線：每門課都先自己做，做不出來也要寫下卡在哪一步。',
   '用到舊知識時有意識地想一下「這是哪條規則、為什麼能這樣用」—— 這本身就是一次複習。']],
  ['03 · 愛好輪換','同一時間只有一個愛好在進攻',11,[
   '🔥 進攻 = 當主角，拿大塊時間，要看得見進步。🔧 維持 = 最低劑量保住手感。⏸ 暫停 = 不碰，但清楚什麼時候回來。',
   '維持劑量：R6 每週約 5 h · 影片每兩週一支 · 建模每週 1 次 1.5–2 h · 樂理每週 3 次 15–20′。',
   '進攻劑量：R6 集中衝分賽季 · 影片每週一支 · 建模做一個完整專案 · 樂理系統跟一門課。',
   '建模一次只跟一個教程或專案。樂理的音程、和弦、音階直接做成 Anki 卡，和學習共用一個複習習慣。',
   '衝 Champion 放到考完試的假期集中打。學期裡每週 5 h 大概率只能保段位，零散打很難上分。']],
  ['04 · R6 規則與調整觸發','按局數算，不按時間',9,[
   '平日一次最多 2 局，週末一次最多 4 局。連輸 2 局就下線。23:00 以後不開新局。',
   '當天的必做（複習塊 + Nacharbeit）沒完成，不開遊戲。',
   '某門課的 Übungsblatt 連續 2 週沒做完 → 正在進攻的愛好降成維持，省下的時間給這門課。',
   '連續 3 天睡不到 7 h → 當晚不開遊戲，先補覺。',
   '到期的 ✗ 題積壓超過 15 道 → 這週不加新卡，先清積壓。',
   '連續 2 週愛好時間不到預算一半、而且心情變差 → 學得太滿了。先砍學習裡效率低的部分（被動重看講義），不要先砍愛好。']]],

 notes:[['課表 · TUCaN',2,'Mathe I（Schmidt · Binder · Schewe）：VL Di + Do 11:40–13:20，首講 Mo 12.10 11:40（僅一次）；Übung 09 Mi 09:50–11:30 · S103/125。\nETiT I（Kupnik）：Mo 15:20–17:00 · Do 17:10–18:50 · Fr 17:10–18:50。\nBuchführung（Schwaiger）15.10–27.11，之後 Bilanzierung 03.12–12.02：Do 13:30–15:10 · Fr 15:20–17:00，都在 S101/A1。\nVertragsrecht（Wendt）：VL Do 15:20–17:00 · Mi 17:10–18:50 不是每週！Übung（14.10 起）和 VL（21.10 起）交替，具體哪週看 TUCaN。\n\n除 Übung 09 外全部在 S101/A1。每週上課約 17 h。已報名但 TUCaN 還沒給時間：ETiT I Übung、Praktikum ETiT IA（含 Einführungsveranstaltung）—— 出來後補一行。'],
        ['輪換表',11,'現在 → 10.10 · Vorkurs 衝刺 + OWO：全部降到最低，R6 每週 ≤ 4 h，其他暫停或每週只碰一次，合計 4–5 h。\n\n12.10 → 18.12 · 上課期 1：🔥 影片 4–5 h · 🔧 R6 5 h · 建模 2 h · 樂理 1 h，合計約 13 h。\n\n21.12 → 08.01 · 聖誕假：學習大複習每週約 20 h；🔥 建模做一個完整 Blender 專案，每週約 10 h；R6、樂理維持，影片剪之前的存貨。\n\n11.01 → 12.02 · 上課期 2 + 開始備考：全部維持，R6 4 h · 影片 2 h · 建模 1 h · 樂理 1 h，合計約 8 h。\n\n考試期（2 月中旬起，看 TUCaN）：R6 每週 ≤ 3 h 只當獎勵，樂理每天 Anki 10′，其他暫停。\n\n考完 → 下學期開學前：🔥 R6 衝 Champion 的賽季，其他三個維持，或給樂理一段進攻期。'],
        ['學期時間線',2,'28.09–10.10 Vorkurs 衝刺 · 05.10–09.10 OWO · 10.10（週六）Ausgangstest · 12.10 Vorlesungsbeginn · 08.11 / 06.12 混合小測 1 · 2 · 21.12–08.01 聖誕假：大複習 + 建模進攻 · 31.01 混合小測 3 · 12.02 Vorlesungsende · 2 月中旬起考試期 · 31.03 Semesterende。\n\n⚠ OWO 壓在 25 天衝刺的最後一週：至少去 Einführungsveranstaltung 和認識同學的活動（組 Lerngruppe 的最好時機）；新內容盡量 04.10 前學完；OWO 那週只在晚上學 60–90′，做模擬卷、改錯、看決策樹；09.10 晚上不學新東西，早點睡。'],
        ['週日 15′ 複盤',5,'這週學習 ___ h，愛好 ___ h\n新增 ✗ ___ 道，劃掉 ___ 道\nAnki 到期的卡片都做完了嗎？\n每門課的 Übungsblatt 都做了嗎？\n下週最重要的 3 件事：\n下週哪個愛好在「進攻」？'],

 cards:[
  ['01 · Three layers of review','Re-reading is not review: shut the book, then think, write and solve yourself',0,[
   'Daily · the 30′ review block is the first thing you study: Anki due cards 15′ + one due ✗ problem 15′ (cover the answer, solve it).',
   'Daily · Nacharbeit within 24 h of each lecture: shut the slides, write 3–5 key points, compare and fill gaps in red, turn new Definitionen / Formeln into Anki cards.',
   'Every Sunday · 20′ of blurting per course: 10′ writing everything from this week (definitions, formulas + Voraussetzungen, methods), 10′ comparing and marking in red; red becomes a card or a ✗ problem. Then redo all of this week’s ✗.',
   'Every 4 weeks · a 60–90′ timed, closed-book mixed test drawn from all Übungsblätter: 08.11 · 06.12 · Christmas big review · 31.01.',
   '✗ intervals: day 1 → 3 → 7 → 21. Fail once and you restart at day 1; two independent successes in a row and it is crossed off. Easiest as Anki cards.',
   'Anki holds only what must be remembered: definitions, formulas + Voraussetzungen, “see X → do Y”, Soll / Haben, Anspruchsgrundlagen and Prüfungsschema. ≤ 15–20 new cards a day, FSRS on.']],
  ['02 · Weight of each course','~19 h self-study + 18–22 h lectures ≈ 38–40 h / week',2,[
   'Mathe I (8 CP) 6 h and ETiT I (7 CP) 5 h get the most — hardest, most credits, and dependent on each other: fall behind in maths and ETiT stalls too.',
   'Buchführung und Bilanzierung (5 CP) 2 h: one fixed set of Buchungssätze every week.',
   'Vertragsrecht (5 CP) 2 h: practise Fälle and Gutachtenstil, Anki for Anspruchsgrundlagen.',
   'Praktikum ETiT IA (2 CP): as scheduled, about 1 h. The daily review block is shared by all courses, ~3 h / week.',
   'The weekly Übungsblatt is the floor: attempt every course’s sheet yourself first, and if you cannot, write down which step stopped you.',
   'Whenever old material is used, consciously ask “which rule is this and why does it apply?” — that is a review in itself.']],
  ['03 · Hobby rotation','Only one hobby attacks at a time',11,[
   '🔥 Attack = lead role, big blocks, visible progress. 🔧 Maintain = minimum dose to keep the feel. ⏸ Pause = hands off, but with a known return date.',
   'Maintenance dose: R6 ~5 h / week · one short video every two weeks · modelling once a week, 1.5–2 h · theory 3 × 15–20′ a week.',
   'Attack dose: R6 a focused ranked season · one video a week · modelling one complete project · theory one course, start to finish.',
   'Modelling follows one tutorial or project at a time. Intervals, chords and scales go straight into Anki and share the study review habit.',
   'The push for Champion goes into the break after exams. ~5 h a week during term will most likely only hold the rank; scattered play rarely climbs.']],
  ['04 · R6 rules and adjustment triggers','Counted in matches, not minutes',9,[
   'At most 2 matches per sitting on weekdays, 4 at weekends. Two losses in a row → log off. No new match after 23:00.',
   'Must-dos not done (review block + Nacharbeit) → no game today.',
   'A course’s Übungsblatt unfinished 2 weeks running → the attacking hobby drops to maintain and the time goes to that course.',
   'Under 7 h of sleep 3 nights running → no game tonight, sleep first.',
   'More than 15 due ✗ problems piled up → no new cards this week, clear the backlog first.',
   'Hobby time under half its budget for 2 weeks and mood dropping → the study load is too full. Cut the low-yield study first (passively re-reading slides), not the hobbies.']]],

 notes:[['Timetable · TUCaN',2,'Mathe I (Schmidt · Binder · Schewe): lecture Tue + Thu 11:40–13:20, first lecture Mon 12.10 11:40 (one-off); Übung 09 Wed 09:50–11:30 · S103/125.\nETiT I (Kupnik): Mon 15:20–17:00 · Thu 17:10–18:50 · Fri 17:10–18:50.\nBuchführung (Schwaiger) 15.10–27.11, then Bilanzierung 03.12–12.02: Thu 13:30–15:10 · Fri 15:20–17:00, both in S101/A1.\nVertragsrecht (Wendt): lecture Thu 15:20–17:00 · Wed 17:10–18:50 NOT every week — Übung (from 14.10) and lecture (from 21.10) alternate; check TUCaN for the exact weeks.\n\nAll in S101/A1 except Übung 09. About 17 h of lectures a week. Registered but not yet timetabled by TUCaN: ETiT I Übung, Praktikum ETiT IA (incl. Einführungsveranstaltung) — add a row once the times appear.'],
        ['Rotation table',11,'Now → 10.10 · Vorkurs sprint + OWO: everything at minimum, R6 ≤ 4 h / week, the rest paused or touched once a week, 4–5 h in total.\n\n12.10 → 18.12 · lecture period 1: 🔥 video 4–5 h · 🔧 R6 5 h · modelling 2 h · theory 1 h, about 13 h in total.\n\n21.12 → 08.01 · Christmas break: big study review ~20 h / week; 🔥 modelling: one complete Blender project, ~10 h / week; R6 and theory maintain, video edits from the backlog.\n\n11.01 → 12.02 · lecture period 2 + exam prep begins: all maintain, R6 4 h · video 2 h · modelling 1 h · theory 1 h, about 8 h in total.\n\nExam period (from mid-February, see TUCaN): R6 ≤ 3 h / week as a reward only, theory 10′ of Anki a day, everything else paused.\n\nAfter exams → next semester: 🔥 R6, the ranked season for Champion; the other three maintain, or theory gets an attack phase.'],
        ['Semester timeline',2,'28.09–10.10 Vorkurs sprint · 05.10–09.10 OWO · 10.10 (Sat) Ausgangstest · 12.10 Vorlesungsbeginn · 08.11 / 06.12 mixed tests 1 · 2 · 21.12–08.01 Christmas break: big review + modelling attack · 31.01 mixed test 3 · 12.02 Vorlesungsende · exams from mid-February · 31.03 Semesterende.\n\n⚠ OWO lands on the last week of the 25-day sprint: at least attend the Einführungsveranstaltung and the meet-your-cohort events (best moment to form a Lerngruppe); finish new material by 04.10 if possible; that week study only 60–90′ in the evening — mock papers, corrections, decision trees; nothing new on the evening of 09.10, early night.'],
        ['Sunday 15′ review',5,'This week: study ___ h, hobbies ___ h\nNew ✗ ___, crossed off ___\nAll due Anki cards done?\nEvery course’s Übungsblatt done?\nThe 3 most important things next week:\nWhich hobby attacks next week?'],
        ['Time budget',12,'Semester 1: 27 CP × 30 h ≈ 810 h → 38–40 h a week in the lecture period (incl. lectures).\n\nA week has 168 h: sleep 56 · meals, chores, commute, washing ~25 · study ~39 · hobbies ~13 · exercise, friends, rest, buffer ~35.\n\nConclusion: all four hobbies can stay, but not all four can attack at once — hence the rotation.']]

/* ═══════════ 2. 状态 ═══════════ */
const KEY = 'rail-planner-v3', LKEY = 'rail-planner-lang';
const $ = s => document.querySelector(s);
const app = $('#app'), statusEl = $('#status'), pal = $('#pal'), startEl = $('#start');
const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const uid = p => p + Math.random().toString(36).slice(2,8);
const ED = 'contenteditable="plaintext-only"';

let lang = pickLang(), t = UI[lang], state = null, mode = 'edit', saveTimer = null;

function pickLang(){
  try { const s = localStorage.getItem(LKEY); if (s && UI[s]) return s; } catch(e){}
  const n = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
  const l = n.toLowerCase();
  if (l.startsWith('de')) return 'de';
  if (l.startsWith('zh')) return /hant|tw|hk|mo/.test(l) ? 'zh-Hant' : 'zh-Hans';
  return 'en';
}

/* 模板构造 —— demo（填好的）/ blank（只有骨架）/ min（极简） */
function demoState(L){
  const d = DEMO[L], D = UI[L].days;
  return {
    v:3, title:d.title, lede:d.lede,
    stats:d.stats.map(([value,label]) => ({id:uid('s'), value, label})),
    sections:{day:sec(d,'day'), week:sec(d,'week'), time:secTime(d), rules:sec(d,'rules'), card:sec(d,'card'), notes:sec(d,'notes')},
    day:d.day.map(([time,name,note,dur,ci,up]) => {
      const o = {id:uid('d'), time, name, note, dur, color:PRESETS[ci]};
      if (up) o.up = up; return o;
    }),
    week:{days:D.slice(), rows:d.week.rows.map(([label,sub,ci,cells]) =>
      ({id:uid('w'), label, sub, color:PRESETS[ci], cells:cells.slice()}))},
    weekNote:d.weekNote,
    cards:d.cards.map(([eyebrow,title,ci,items]) =>
      ({id:uid('c'), eyebrow, title, color:PRESETS[ci], items:items.slice()})),
    strip:d.strip.map(([label,kind,text,hi]) => {
      const o = {id:uid('p'), label, kind, text}; if (hi) o.hi = 1; return o;
    }),
    notes:d.notes.map(([label,ci,text]) => ({id:uid('n'), label, color:PRESETS[ci], text})),
    events:(d.events || []).map(([day,start,end,name,ci]) => ({id:uid('e'), day, start, end, name, color:PRESETS[ci]}))
  };
}
const sec = (d,k) => ({title:d.sec[k][0], desc:d.sec[k][1]});
const secTime = (d) => d.sec.time ? {title:d.sec.time[0], desc:d.sec.time[1]} : {title:UI[lang].secTime, desc:UI[lang].secTimeDesc};

    week:{days:D.slice(), rows:[0,1,2,3,4,5].map(i =>

/* ═══════════ 3. 存取 ═══════════ */
const LIB = 'rail-planner-lib';
let lib = {current:null, plans:[]};           // 计划库：每个模板选择都是新增一份，从不覆盖
const okState = o => !!(o && o.day && o.week && o.sections);
const curPlan = () => lib.plans.find(p => p.id === lib.current) || null;

function saveLib(){
  try { localStorage.setItem(LIB, JSON.stringify(lib)); } catch(e){}
}
function save(){
  const p = curPlan();
  if (p){ p.state = state; p.updated = Date.now(); }
  saveLib();
}
function queueSave(){
  const p = curPlan(); if (p) p.touched = true;
  statusEl.textContent = t.saving;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { save(); statusEl.textContent = t.saved; }, 500);
}
function loadLib(){
  try {
    const raw = localStorage.getItem(LIB);
    if (raw){ const o = JSON.parse(raw); if (o && Array.isArray(o.plans)) return o; }
  } catch(e){}
  /* 迁移：之前只存一份的两个老键 */
  for (const k of [KEY, 'rail-planner-v2']){
    try {
      const o = JSON.parse(localStorage.getItem(k) || 'null');
      if (okState(o)){
        const id = uid('pl');
        return {current:id, plans:[{id, name:(o.title || '').trim() || t.untitled, state:o, updated:Date.now()}]};
      }
    } catch(e){}
  }
  return {current:null, plans:[]};
}
function addPlan(name, st){
  const p = {id:uid('pl'), name, state:st, updated:Date.now()};
  lib.plans.push(p); lib.current = p.id; state = st;
  saveLib(); return p;
}
function openPlan(id){
  const p = lib.plans.find(x => x.id === id);
  if (!p) return;
  lib.current = id; state = p.state; saveLib();
  startEl.classList.remove('on');
  render(); paintPlanName();
  statusEl.textContent = t.saved;
  scrollTo(0,0);
}
const stamp = ms => new Date(ms).toLocaleDateString('de-DE', {timeZone:'Europe/Berlin', day:'2-digit', month:'2-digit'});

/* ═══════════ 4. 路径读写 ═══════════ */
function atPath(path){
  const parts = path.split('.');
  let o = state;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  return [o, parts[parts.length - 1]];
}
const writePath = (p,v) => { const [o,k] = atPath(p); o[k] = v; };
const readPath = p => { const [o,k] = atPath(p); return o[k]; };

/* ═══════════ 5. 渲染 ═══════════ */
function txt(path, cls, ph){
  return `<div class="${cls || ''}" ${ED} data-bind="${path}" data-ph="${esc(ph || t.phAny)}">${esc(readPath(path))}</div>`;
}
const tools = parts => `<div class="tools">${parts.join('')}</div>`;
const grip = () => `<button class="ic grip" data-grip title="${esc(t.tipDrag)}" aria-label="${esc(t.tipDrag)}">⠿</button>`;
const del = (kind,id) => `<button class="ic del" data-del="${kind}" data-id="${id}" title="${esc(t.tipDel)}" aria-label="${esc(t.tipDel)}">✕</button>`;
const ins = (kind,id,tip) => `<button class="ic add" data-ins="${kind}" data-id="${id}" title="${esc(tip)}" aria-label="${esc(tip)}">＋</button>`;
function swatch(path){
  const v = readPath(path) || '#8E8E93';
  return `<span class="sw" style="--c:${esc(v)}" data-sw="${path}">`
    + `<button class="swb" data-pal="${path}" title="${esc(t.tipColor)}" aria-label="${esc(t.tipColor)}"></button>`
    + `<input type="color" value="${esc(v)}" data-color="${path}" tabindex="-1" aria-hidden="true"></span>`;
}

const tmin = v => { const m = /^(\d{1,2})[:.](\d{2})$/.exec(String(v || '').trim()); if (!m) return null; const h = +m[1], mi = +m[2]; return (h > 24 || mi > 59) ? null : Math.min(1440, h * 60 + mi); };
const tfmt = m => String(Math.floor(m / 60)).padStart(2,'0') + ':' + String(m % 60).padStart(2,'0');
function migrate(s){
  if (!s.events) s.events = [];
  if (!s.sections.time) s.sections.time = {title:t.secTime, desc:''};
  if (s.timeSync == null) s.timeSync = true;
}
/* 时间、日期一律按德国 */
const TZ = 'Europe/Berlin';
function berlinNow(){
  const p = new Intl.DateTimeFormat('en-US', {timeZone:TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', weekday:'short', hour12:false}).formatToParts(new Date());
  const g = k => (p.find(x => x.type === k) || {}).value || '';
  const wd = {Mon:0, Tue:1, Wed:2, Thu:3, Fri:4, Sat:5, Sun:6}[g('weekday')] ?? 0;
  return {y:+g('year'), m:+g('month'), d:+g('day'), h:(+g('hour')) % 24, mi:+g('minute'), wd};
}
function weekDates(){
  const n = berlinNow(), base = Date.UTC(n.y, n.m - 1, n.d);
  return Array.from({length:7}, (_, i) => { const d = new Date(base + (i - n.wd) * 864e5); return String(d.getUTCDate()).padStart(2,'0') + '.' + String(d.getUTCMonth() + 1).padStart(2,'0') + '.'; });
}
function paintNow(){
  const tl = app.querySelector('.tl'); if (!tl) return;
  tl.querySelectorAll('.tlnow').forEach(x => x.remove());
  tl.querySelectorAll('.tlh.today').forEach(x => x.classList.remove('today'));
  const n = berlinNow(), bodies = tl.querySelectorAll('.tlbody'), heads = tl.querySelectorAll('.tlh');
  if (bodies.length !== 7) return;
  const HPX = parseFloat(getComputedStyle(tl).getPropertyValue('--hpx')) || 30;
  const line = document.createElement('div'); line.className = 'tlnow'; line.style.top = ((n.h * 60 + n.mi) / 60 * HPX) + 'px';
  bodies[n.wd].appendChild(line); heads[n.wd].classList.add('today');

/* 一日轨道 → 时间轴：铺一天（带 from 的旧时段被替换，手动加的保留） */
function fillDay(di){
  let cur = null; const evs = [];
  for (const b of state.day){
    let a = tmin(b.time); if (a == null){ if (cur == null) continue; a = cur; }
    const e = Math.min(1440, a + Math.max(5, +b.dur || 5));
    if (e <= a) continue;
    evs.push({id:uid('e'), day:di, start:tfmt(a), end:tfmt(e), name:b.name || b.note || '', color:b.color, from:b.id});
    cur = e;
  }
  state.events = state.events.filter(x => x.day !== di).concat(evs);
}
function syncLinked(blockId){
  if (!state.timeSync) return;
  const b = state.day.find(x => x.id === blockId); if (!b) return;
  const a = tmin(b.time);
  state.events.forEach(e => {
    if (e.from !== blockId) return;
    if (a != null){ e.start = tfmt(a); e.end = tfmt(Math.min(1440, a + Math.max(5, +b.dur || 5))); }
    e.name = b.name || b.note || ''; e.color = b.color;
  });
}
function patchLinked(blockId){
  if (!state.timeSync) return;
  const HPX = 30;
  state.events.forEach(e => {
    if (e.from !== blockId) return;
    const el = app.querySelector('.ev[data-id="' + e.id + '"]'); if (!el) return;
    const a = tmin(e.start) ?? 540, b = Math.max(a + 15, tmin(e.end) ?? a + 60);
    el.style.top = (a / 60 * HPX) + 'px'; el.style.height = ((b - a) / 60 * HPX) + 'px'; el.style.setProperty('--c', e.color);
    el.classList.toggle('short', (b - a) / 60 * HPX < 30);
    const et = el.querySelector('.et'), en = el.querySelector('.en');
    if (et && document.activeElement !== et) et.textContent = e.start + '–' + e.end;
    if (en && document.activeElement !== en) en.textContent = e.name;
  });
}

document.addEventListener('input', e => {
  const el = e.target.closest('[data-bind]');
  if (el && el.dataset.time){ return; }   /* time range: parsed on blur */
  if (el){
    let v = el.dataset.html ? el.innerHTML : el.textContent;
    if (el.dataset.num) v = v.replace(/[^\d]/g,'');
    writePath(el.dataset.bind, el.dataset.num ? (parseInt(v,10) || 0) : v);
    const dm = /^day\.(\d+)\./.exec(el.dataset.bind);
    if (dm && state.day[+dm[1]]){ syncLinked(state.day[+dm[1]].id); patchLinked(state.day[+dm[1]].id); }
    queueSave();
    return;
  }
  const c = e.target.closest('[data-color]');
  if (c) applyColor(c.dataset.color, c.value);
});

function applyColor(path, val){
  writePath(path, val);
  const sw = app.querySelector('[data-sw="' + path + '"]');
  if (sw){
    sw.style.setProperty('--c', val);
    const inp = sw.querySelector('input[type=color]');
    if (inp) inp.value = val;
    const host = sw.closest('.blk, .wrowhead, .card, .note, .ev');
    if (host){
      host.style.setProperty('--c', val);
      if (host.classList.contains('blk')){ syncLinked(host.dataset.id); patchLinked(host.dataset.id); }
      if (host.classList.contains('wrowhead')){
        host.parentElement.querySelectorAll('.wcell.tint').forEach(x => x.style.setProperty('--c', val));
      }
    }
  }
  if (palPath === path) paintPal();
  queueSave();
}

function blank(kind){
  if (kind === 'day')   return {id:uid('d'), time:'', name:t.newDay, note:'', dur:60, color:'#8E8E93'};
  if (kind === 'week')  return {id:uid('w'), label:t.newWeek, sub:'', color:'#8E8E93', cells:state.week.days.map(() => '')};
  if (kind === 'cards') return {id:uid('c'), eyebrow:t.newCardEye, title:t.newCard, color:'#8E8E93', items:[t.newItem]};
  if (kind === 'strip') return {id:uid('p'), label:t.newStrip, kind:'line', text:''};
  if (kind === 'stats') return {id:uid('s'), value:'', label:''};
  if (kind === 'notes') return {id:uid('n'), label:t.newNote, color:'#9AA0A6', text:''};
  if (kind === 'events') return {id:uid('e'), day:0, start:'09:00', end:'10:00', name:t.newEvent, color:PRESETS[0]};

app.addEventListener('click', e => {
  const fd = e.target.closest('[data-fillday]');
  if (fd){
    const k = fd.dataset.fillday;
    const days = k === 'all' ? [0,1,2,3,4,5,6] : k === 'work' ? [0,1,2,3,4] : [+k];
    const go = () => { days.forEach(fillDay); render(); queueSave(); };
    if (state.events.some(x => days.includes(x.day) && !x.from)) ask(t.fillT, t.fillD, go, t.replace); else go();
    return;
  }
  const ae = e.target.closest('[data-addev]');
  if (ae){
    const day = +ae.dataset.addev, same = state.events.filter(x => x.day === day);
    const last = same.length ? Math.max(...same.map(x => tmin(x.end) || 0)) : 540;
    const st = Math.min(1380, Math.max(360, last)), o = blank('events');
    o.day = day; o.start = tfmt(st); o.end = tfmt(Math.min(1440, st + 60));
    state.events.push(o); render(); queueSave(); return;
  }
  const md = e.target.closest('[data-evday]');
  if (md){
    const ev = state.events.find(x => x.id === md.dataset.id);
    if (ev){ ev.day = (ev.day + +md.dataset.evday + 7) % 7; render(); queueSave(); }
    return;
  }
  const a = e.target.closest('[data-add]');
  if (a){
    const k = a.dataset.add;
    const map = {day:'day', week:'week', card:'cards', strip:'strip', stat:'stats', note:'notes'};
    if (map[k]) listOf(map[k]).push(blank(map[k]));
    if (k === 'item'){
      const c = state.cards.find(x => x.id === a.dataset.id);
      if (c) c.items.push(t.newItem);
    }
    render(); queueSave(); return;
  }
  const n = e.target.closest('[data-ins]');
  if (n){
    const k = n.dataset.ins, list = listOf(k);
    const at = list.findIndex(x => x.id === n.dataset.id);
    list.splice(at < 0 ? list.length : at + 1, 0, blank(k));
    render(); queueSave(); return;
  }
  const d = e.target.closest('[data-del]');
  if (d){
    const k = d.dataset.del, id = d.dataset.id;
    const dmap = {day:'day', week:'week', cards:'cards', strip:'strip', stat:'stats', notes:'notes', events:'events'};
    if (dmap[k]){
      const list = listOf(dmap[k]);
      const at = list.findIndex(x => x.id === id);
      if (at >= 0) list.splice(at, 1);
      if (k === 'day') state.events.forEach(ev => { if (ev.from === id) delete ev.from; });
    }
    if (k === 'item'){
      const c = state.cards.find(x => x.id === id);
      if (c) c.items.splice(+d.dataset.j, 1);
    }
    render(); queueSave();
  }
});

let drag = null;
function wireSort(){
  app.querySelectorAll('[data-grip]').forEach(g => {
    g.addEventListener('pointerdown', () => {
      const item = g.closest('[data-sort]');
      if (item) item.setAttribute('draggable','true');
    });
  });
  app.querySelectorAll('[data-sort]').forEach(item => {
    item.addEventListener('dragstart', ev => {
      drag = {key:item.dataset.sort, id:item.dataset.id};
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', item.dataset.id);
      try { ev.dataTransfer.setDragImage(item, 24, 20); } catch(e){}
      requestAnimationFrame(() => item.classList.add('dragging'));
    });
    item.addEventListener('dragend', () => {
      item.removeAttribute('draggable');
      item.classList.remove('dragging');
      app.querySelectorAll('.drop-mark').forEach(x => x.classList.remove('drop-mark'));
      drag = null;
    });
    item.addEventListener('dragover', ev => {
      if (!drag || item.dataset.sort !== drag.key) return;
      ev.preventDefault();
      app.querySelectorAll('.drop-mark').forEach(x => x.classList.remove('drop-mark'));
      if (item.dataset.id !== drag.id) item.classList.add('drop-mark');
    });
    item.addEventListener('drop', ev => {
      if (!drag || item.dataset.sort !== drag.key) return;
      ev.preventDefault();
      const list = listOf(drag.key);
      const from = list.findIndex(x => x.id === drag.id);
      if (from < 0 || list.findIndex(x => x.id === item.dataset.id) < 0) return;
      const horiz = drag.key !== 'week';
      const r = item.getBoundingClientRect();
      const after = horiz ? (ev.clientX > r.left + r.width / 2) : (ev.clientY > r.top + r.height / 2);
      const [moved] = list.splice(from, 1);
      const to = list.findIndex(x => x.id === item.dataset.id);
      list.splice(after ? to + 1 : to, 0, moved);
      render(); queueSave();
    });
  });
}

/* 提示词：角色被钉死在“给这个页面排计划”上；页面只接受计划 JSON */
const LANG_NAME = {'zh-Hans':'Simplified Chinese', 'zh-Hant':'Traditional Chinese', en:'English', de:'German'};
function aiSystem(){
  return `You are the built-in planning assistant of "Rail Planner", a web page where one person lays out a single day as a horizontal rail of time blocks, a 7-column week grid, a set of house rules (cards), a daily card strip and free notes.

You do exactly ONE job: turn the person's requirements into a plan for this page, or revise the plan they already have. Nothing else — no general conversation, no code, no essays, no advice unrelated to scheduling this page. If the request is not about planning a schedule, routine, time allocation or house rules for this page, reply with exactly one JSON object: {"refuse": "<one short sentence, in the person's language, saying you only plan schedules and rules here>"}

Planning philosophy (apply unless the person says otherwise):
- A day is a rail: fixed "posts" (meals, sleep, training, a short daily wrap-up) never move; elastic study/work blocks may stretch.
- Put the most important work in the person's peak hours. Exactly one thing per day is allowed to overrun, and it gets a named buffer block; state the overrun order (what gives way first) in the rules.
- Every activity has a hard ceiling. Protect sleep, meals and relationships as capacity, not rewards.
- Spread themes across the week instead of cramming one day; keep at least one lighter recovery day.
- Include a "floor day" fallback for bad days.
- Wording must be concrete and startable. Durations in whole minutes. Times ascending, consecutive and non-overlapping from waking to sleeping.

OUTPUT: exactly one JSON object and nothing else — no markdown fences, no commentary before or after. Write all text in ${LANG_NAME[lang]} unless the person clearly writes in another language, then use theirs.

Schema (include ONLY the top-level keys listed under REQUESTED PARTS; omit all others):
{
 "title": string, "lede": string,
 "stats": [{"value": string, "label": string}],            // 3-5 short headline figures
 "sections": {"day":{"title":string,"desc":string}, "week":{...}, "rules":{...}, "card":{...}, "notes":{...}},
 "day": [{"time":"HH:MM","name":string,"note":string,"dur":int,"up":int,"color":"#hex"}],   // 8-22 blocks; "up" = max stretch in minutes, only on elastic blocks
 "week": {"days":[7 short weekday names], "rows":[{"label":string,"sub":string,"color":"#hex","cells":[7 strings]}]},  // 4-9 rows; use "—" for an empty cell
 "events": [{"day":0-6,"start":"HH:MM","end":"HH:MM","name":string,"color":"#hex"}],   // the week as a timetable: every fixed appointment plus the main study/hobby/meal/sleep blocks of each day (day 0 = the first weekday column); 40-120 entries, non-overlapping within a day
 "weekNote": string,
 "cards": [{"eyebrow":string,"title":string,"color":"#hex","items":[string]}],   // 3-5 cards, 3-6 items each; eyebrow like "01 · Quality gate"
 "strip": [{"label":string,"kind":"line"|"box","text":string,"hi":boolean}],    // 5-9 slots; exactly one hi:true (the one thing that makes the day count); 1-2 "box" slots whose text is checkbox items like "☐ A　☐ B"
 "notes": [{"label":string,"color":"#hex","text":string}]                       // 1-3 notes; text may contain \n
}
Colors — use only these hex values: ${PRESETS.join(', ')}. Convention: #0071e3 the priority subject, #5E8C6A life/body posts, #C77D2B theme blocks, #9AA0A6 breaks and skippable items, #7D6BB0 evening/leisure, #E0392B rules about limits, #D9548A relationships.`;
}
function aiUser(req, scopeKeys, mode){
  const parts = scopeKeys.map(k => k === 'head' ? 'title, lede, stats, sections' : k === 'rules' ? 'cards' : k === 'card' ? 'strip' : k === 'week' ? 'week, weekNote, events' : k).join('; ');
  let u = `REQUESTED PARTS: ${parts}\nMODE: ${mode === 'replace' && state ? 'revise the current plan below — keep what still fits, change what the request asks for' : 'create a new plan from scratch'}\n\nPERSON'S REQUEST:\n${req}`;
  if (state){
    const cur = {title:state.title, lede:state.lede, stats:state.stats.map(x => ({value:x.value, label:x.label})),
      sections:state.sections,
      day:state.day.map(b => ({time:b.time, name:b.name, note:b.note, dur:b.dur, up:b.up, color:b.color})),
      week:{days:state.week.days, rows:state.week.rows.map(r => ({label:r.label, sub:r.sub, color:r.color, cells:r.cells}))},
      weekNote:state.weekNote,
      events:(state.events || []).map(e => ({day:e.day, start:e.start, end:e.end, name:e.name, color:e.color})),
      cards:state.cards.map(c => ({eyebrow:c.eyebrow, title:c.title, color:c.color, items:c.items})),
      strip:state.strip.map(p => ({label:p.label, kind:p.kind, text:p.text.replace(/<br\s*\/?>/gi,'\n'), hi:!!p.hi})),
      notes:state.notes.map(n => ({label:n.label, color:n.color, text:n.text}))};
    let js = JSON.stringify(cur);
    if (js.length > 18000) js = js.slice(0, 18000) + '…';
    u += `\n\nCURRENT PLAN (JSON, for context${mode === 'replace' ? ' and revision' : ' only'}):\n${js}`;
  }
  return u;
}

/* 流式调用 Anthropic API（公开网页用） */
async function callAPI(system, user, onText, signal){
  const res = await fetch(API + '/messages', {method:'POST', signal, headers:apiHeaders(ai.key),
    body:JSON.stringify({model:ai.model, max_tokens:8192, stream:true, system, messages:[{role:'user', content:user}]})});
  if (!res.ok){ let m = ''; try { m = (await res.json()).error?.message || ''; } catch(e){} throw new Error(res.status + ' ' + m); }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', text = '', stop = null;
  for (;;){
    const {value, done} = await reader.read(); if (done) break;
    buf += dec.decode(value, {stream:true});
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0){
      const evt = buf.slice(0, i); buf = buf.slice(i + 2);
      for (const line of evt.split('\n')){
        if (!line.startsWith('data:')) continue;
        let j; try { j = JSON.parse(line.slice(5).trim()); } catch(e){ continue; }
        if (j.type === 'content_block_delta' && j.delta?.type === 'text_delta'){ text += j.delta.text; onText(text); }
        else if (j.type === 'message_delta' && j.delta?.stop_reason) stop = j.delta.stop_reason;
        else if (j.type === 'error') throw new Error(j.error?.message || 'stream error');
      }
    }
  }
  return {text, truncated: stop === 'max_tokens'};
}
async function callSample(system, user, onText, signal){
  const r = await sampleFn(system + '\n\n' + user, {onText:({text}) => onText(text), signal, modelTier:'complex', cache:false});
  return {text:r.text, truncated:!!r.truncated};
}

/* 把模型输出收成页面能用的状态 —— 只认计划字段，其他一概丢弃 */
function extractJSON(txt){
  try { return JSON.parse(txt); } catch(e){}
  const m = txt.match(/```(?:json)?\s*([\s\S]*?)```/); if (m){ try { return JSON.parse(m[1]); } catch(e){} }
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
  if (a >= 0 && b > a){ try { return JSON.parse(txt.slice(a, b + 1)); } catch(e){} }
  return null;
}
function normalizePlan(o, base, scope){
  const out = JSON.parse(JSON.stringify(base));
  const S = v => v == null ? '' : String(v);
  const N = (v, d) => { const n = parseInt(v, 10); return Number.isFinite(n) && n > 0 ? n : d; };
  const C = v => /^#[0-9a-f]{6}$/i.test(S(v)) ? S(v) : PRESETS[0];
  const A = v => Array.isArray(v) ? v : [];
  if (scope.head){
    if (o.title != null) out.title = S(o.title);
    if (o.lede != null) out.lede = S(o.lede);
    if (A(o.stats).length) out.stats = A(o.stats).slice(0, 6).map(x => ({id:uid('s'), value:S(x.value), label:S(x.label)}));
    if (o.sections && typeof o.sections === 'object'){
      for (const k of ['day','week','rules','card','notes']){
        const v = o.sections[k]; if (!v) continue;
        out.sections[k] = {title:S(v.title) || out.sections[k].title, desc:S(v.desc)};
      }
    }
  }
  if (scope.day){
    out.day = A(o.day).slice(0, 30).map(b => {
      const r = {id:uid('d'), time:S(b.time), name:S(b.name), note:S(b.note), dur:N(b.dur, 60), color:C(b.color)};
      const up = N(b.up, 0); if (up > r.dur) r.up = up; return r;
    });
    if (!out.day.length) throw new Error('nojson');
  }
  if (scope.week){
    const days = A(o.week?.days).length === 7 ? o.week.days.map(S) : out.week.days;
    const rows = A(o.week?.rows).slice(0, 12).map(r => ({id:uid('w'), label:S(r.label), sub:S(r.sub), color:C(r.color),
      cells:Array.from({length:7}, (_, i) => { const c = A(r.cells)[i]; return c == null ? '—' : S(c); })}));
    if (!rows.length) throw new Error('nojson');
    out.week = {days, rows};
    if (o.weekNote != null) out.weekNote = S(o.weekNote);
    if (A(o.events).length){
      out.events = A(o.events).slice(0, 200).map(e => {
        const day = Math.min(6, Math.max(0, parseInt(e.day, 10) || 0));
        const a = tmin(e.start) ?? 540, b = tmin(e.end) ?? a + 60;
        return {id:uid('e'), day, start:tfmt(Math.min(a, 1425)), end:tfmt(Math.max(a + 15, Math.min(1440, b))), name:S(e.name), color:C(e.color)};
      });
    }
  }
  if (scope.rules){
    out.cards = A(o.cards).slice(0, 8).map(c => ({id:uid('c'), eyebrow:S(c.eyebrow), title:S(c.title), color:C(c.color), items:A(c.items).map(S).filter(Boolean)}));
    if (!out.cards.length) throw new Error('nojson');
  }
  if (scope.card){
    out.strip = A(o.strip).slice(0, 12).map(p => {
      const r = {id:uid('p'), label:S(p.label), kind:p.kind === 'box' ? 'box' : 'line', text:esc(S(p.text)).replace(/\n/g, '<br>')};
      if (p.hi) r.hi = 1; return r;
    });
    if (!out.strip.length) throw new Error('nojson');
  }
  if (scope.notes){
    out.notes = A(o.notes).slice(0, 8).map(n => ({id:uid('n'), label:S(n.label), color:C(n.color), text:S(n.text)}));
  }
  return out;
}

function aiSetStatus(html, busy){
  $('#aiStatus').innerHTML = (busy ? '<span class="spin"></span>' : '') + esc(html);
}
function aiReset(){
  aiDraft = null; $('#aiSum').innerHTML = ''; $('#aiApplyRow').hidden = true; $('#aiErr').textContent = '';
  $('#aiOut').classList.remove('on'); $('#aiOut').textContent = ''; aiSetStatus('', false);
}
$('#aiGo').onclick = async () => {
  const req = $('#aiReq').value.trim();
  const scopeKeys = SCOPES.map(x => x[0]).filter(k => aiScopeSel[k]);
  aiReset();
  if (!req){ $('#aiErr').textContent = t.aiNeedReq; return; }
  if (!scopeKeys.length){ $('#aiErr').textContent = t.aiNeedScope; return; }
  if (!aiReady()) return;
  const mode = drawer.querySelector('input[name=aiTarget]:checked').value;
  const scope = Object.fromEntries(scopeKeys.map(k => [k, true]));
  aiCtl = new AbortController();
  $('#aiGo').hidden = true; $('#aiStopBtn').hidden = false;
  aiSetStatus(t.aiThinking, true);
  const out = $('#aiOut');
  const onText = txt => { out.classList.add('on'); out.textContent = txt.slice(-600); out.scrollTop = out.scrollHeight; aiSetStatus(t.aiWriting + ' · ' + txt.length, true); };
  try {
    const sys = aiSystem(), usr = aiUser(req, scopeKeys, mode);
    const r = sampleFn ? await callSample(sys, usr, onText, aiCtl.signal) : await callAPI(sys, usr, onText, aiCtl.signal);
    const obj = extractJSON(r.text);
    if (!obj){ $('#aiErr').textContent = r.truncated ? t.aiTruncated : t.aiNoJson; aiSetStatus('', false); return; }
    if (obj.refuse){ $('#aiErr').textContent = t.aiRefused + String(obj.refuse); aiSetStatus('', false); return; }
    const base = (mode === 'replace' && state) ? state : blankState(lang);
    let plan;
    try { plan = normalizePlan(obj, base, scope); }
    catch(e){ $('#aiErr').textContent = r.truncated ? t.aiTruncated : t.aiNoJson; aiSetStatus('', false); return; }
    aiDraft = {plan, mode, scope};
    const sum = [];
    if (scope.head && plan.title) sum.push(plan.title);
    if (scope.day) sum.push(plan.day.length + ' ' + t.unitBlocks);
    if (scope.week) sum.push(plan.week.rows.length + ' ' + t.unitRows + (plan.events && plan.events.length ? ' · ' + plan.events.length + ' ' + t.unitEvents : ''));
    if (scope.rules) sum.push(plan.cards.length + ' ' + t.unitCards);
    if (scope.card) sum.push(plan.strip.length + ' ' + t.unitCells);
    if (scope.notes) sum.push(plan.notes.length + ' ' + t.unitNotes);
    $('#aiSum').innerHTML = sum.map(x => `<span>${esc(x)}</span>`).join('');
    $('#aiApplyRow').hidden = false;
    aiSetStatus(r.truncated ? t.aiTruncated : t.aiDone, false);
    out.classList.remove('on');
  } catch(e){
    if (e && (e.code === 'cancelled' || e.name === 'AbortError')){ aiSetStatus('', false); }
    else { $('#aiErr').textContent = t.aiErr + (e && (e.message || e.code) || e); aiSetStatus('', false); }
  } finally {
    aiCtl = null; $('#aiGo').hidden = false; $('#aiStopBtn').hidden = true;
  }
};
$('#aiStopBtn').onclick = () => { if (aiCtl) aiCtl.abort(); };
$('#aiDiscard').onclick = aiReset;
$('#aiApply').onclick = () => {
  if (!aiDraft) return;
  const {plan, mode} = aiDraft;
  const name = (plan.title && plan.title.trim()) || t.aiPlanName;
  const finish = () => {
    aiReset(); closeAI();
    startEl.classList.remove('on');
    render(); paintPlanName();
    statusEl.textContent = t.saved;
    scrollTo(0,0);
  };
  const cur = curPlan();
  if (mode === 'replace' && cur){
    const doReplace = () => { cur.state = plan; cur.name = name + ' · ' + stamp(Date.now()); cur.touched = true; cur.updated = Date.now(); state = plan; saveLib(); finish(); };
    if (cur.touched) ask(t.reT, t.reD, doReplace, t.replace); else doReplace();
    return;
  }
  addPlan(name + ' · ' + stamp(Date.now()), plan);
  curPlan().touched = true; saveLib();
  finish();
};

/* ═══════════ 10. 启动 ═══════════ */
lib = loadLib();
paintChrome();
const cur = curPlan();
if (cur){
  state = cur.state;
  render(); paintPlanName();
  statusEl.textContent = t.saved;
} else {
  showChooser('new');
}
</script>
